<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="65%" stop-color="#FFB845"/>
      <stop offset="100%" stop-color="#F08A1C"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(900,315)">
    <circle r="200" fill="url(#sun)" opacity="0.95"/>
    <g stroke="#000" stroke-opacity="0.55" stroke-linecap="round" stroke-width="14">
      <line x1="-260" y1="-90" x2="260" y2="-90"/>
      <line x1="-260" y1="-30" x2="260" y2="-30"/>
      <line x1="-260" y1="30"  x2="260" y2="30"/>
      <line x1="-260" y1="90"  x2="260" y2="90"/>
    </g>
  </g>

  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="220" font-size="84" font-weight="800" letter-spacing="-2">TOP 차광망</text>
    <text x="80" y="310" font-size="46" font-weight="600" fill="#f5f5f7">최고의 차광 솔루션</text>
    <text x="80" y="380" font-size="28" font-weight="400" fill="#a1a1a6">35%~95% 차광률 · 고강도 HDPE · 맞춤 재단</text>
    <text x="80" y="540" font-size="22" font-weight="500" fill="#a1a1a6">농업 · 건설 · 축산 · 공공시설 현장에 맞춤 공급</text>
  </g>
</svg>
